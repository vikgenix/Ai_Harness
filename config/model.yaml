# Shrike model configuration.
#
# The API key is NEVER stored here. It is read at runtime from the
# AI_API_KEY environment variable.
#
# Non-secret settings can also be overridden with environment variables:
#   AI_PROVIDER, AI_MODEL, AI_BASE_URL

# Which API to call: auto | anthropic | openai | gemini | groq | openai-compatible
# "auto" picks the provider from the key's prefix:
#   sk-ant- -> anthropic   gsk_ -> groq   AIza -> gemini
#   sk-or-  -> openai-compatible (OpenRouter)   sk- -> openai
provider: auto

# Model to use. null = use the provider's default listed under `defaults`.
model: null

# Only needed for openai-compatible endpoints (Ollama, DeepSeek, Together, ...).
base_url: null

max_output_tokens: 16000

# How hard the model thinks: low | medium | high | xhigh | max, or null to
# leave it to the provider. Higher fixes harder bugs but uses more tokens.
# Translated per provider (Anthropic `effort`, OpenAI/Groq `reasoning_effort`).
effort: high

# Anthropic only: if a safety filter declines a request, let the API retry it
# on another Claude model instead of stopping (server-side fallback).
refusal_fallback: true

# Repository map: an overview of the repository's files, classes and functions
# (with line numbers) given to the agent at the start of /fix, so it spends
# fewer steps exploring. Size in tokens; 0 turns it off.
repo_map_tokens: 3000

# Self-review: when the agent says a fix is complete, show it its whole diff
# with automatic checks (debugging leftovers, scratch files, missing or weakened
# tests) once before accepting. Costs one extra step.
self_review: true

# Install the repository's dependencies before /fix starts, so the tests can
# run: Python into a virtualenv kept outside the repository (envs/), Node into
# node_modules/, and so on. Skipped when the project files have not changed
# since the last install. install_timeout_s limits each install command.
install_deps: true
install_timeout_s: 600

# Baseline: run the detected test command once on the unchanged code before
# /fix starts, so the agent knows which tests already fail (and whether the
# tests run at all). Cached per commit. A suite slower than the timeout is
# stopped, and the agent is told to run only the tests near its change.
baseline_tests: true
baseline_timeout_s: 120

# Sandbox: where the agent's commands, the install and the baseline tests run.
#   none   - on this machine (default)
#   docker - in a Docker container that only sees the repository (needs Docker
#            running). Also for one run: make run SANDBOX=docker ...
# sandbox_image: null picks an image for the project (python:3.12-slim-bookworm,
# node:22-bookworm-slim, golang:1.23-bookworm, ...). sandbox_network: false
# cuts the container off from the network (installs then fail).
sandbox: none
sandbox_image: null
sandbox_network: true

# Pull requests (/pr, or make run ... PR=1; needs GITHUB_TOKEN): open them as
# drafts, so maintainers see the fix was made by an agent and is not yet
# asking for a merge. The PR body also says it was prepared by Shrike.
pr_draft: true

# Repeatability (spec section 10). Each setting is sent only to providers
# that accept it (for example, the Anthropic API rejects temperature).
temperature: 0
seed: 42

limits:
  max_steps: 60          # tool-call rounds per task before the agent stops
  max_cost_usd: 2.00     # hard spending limit per task
  request_timeout_s: 300
  max_retries: 3         # retries on rate limits, overload and network errors

# Default model per provider. Check each provider's model list before an
# official run; model names change often.
defaults:
  anthropic: claude-opus-5-5
  openai: gpt-5
  gemini: gemini-2.5-pro
  groq: openai/gpt-oss-120b

# USD per 1 million tokens, used for cost tracking and limits.max_cost_usd.
# A model name also matches dated versions (gpt-5 matches gpt-5-2025-08-07).
# Unlisted models still run; their cost is shown as unknown.
# cache_read / cache_write default to the input price when left out.
pricing:
  claude-fable-5-2:  { input: 8.00, output: 40.00, cache_read: 0.20, cache_write: 10.00 }
  claude-opus-5-5:   { input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00 }
  claude-sonnet-5-5: { input: 2.00, output: 10.00, cache_read: 0.10, cache_write: 2.50 }
  claude-haiku-5-5:  { input: 0.10, output: 0.50,  cache_read: 0.01, cache_write: 0.125 }
  # Not verified against current price lists. Check before relying on them.
  gpt-5:               { input: 1.25, output: 10.00, cache_read: 0.125 }
  gemini-2.5-pro:      { input: 1.25, output: 10.00, cache_read: 0.31 }
  openai/gpt-oss-120b: { input: 0.15, output: 0.75 }
